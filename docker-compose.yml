services:
  app:
    build:
      context: .
      args:
        # CPU is the default. For GPU:
        #   docker compose build --build-arg LLAMA_IMAGE=ghcr.io/ggml-org/llama.cpp:server-cuda \
        #                       --build-arg PYTHON_BASE=nvidia/cuda:12.4.1-runtime-ubuntu22.04 \
        #                       --build-arg TORCH_INDEX_URL=https://download.pytorch.org/whl/cu124
        LLAMA_IMAGE: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
        LIVEKIT_IMAGE: ${LIVEKIT_IMAGE:-livekit/livekit-server:latest}
        PYTHON_BASE: ${PYTHON_BASE:-python:3.11-slim}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    env_file:
      - .env
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://127.0.0.1:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      STT_PROVIDER: ${STT_PROVIDER:-groq}
      LLAMA_HF_REPO: ${LLAMA_HF_REPO:-unsloth/Qwen3-4B-Instruct-2507-GGUF}
      LLAMA_CTX_SIZE: ${LLAMA_CTX_SIZE:-16384}
      LLAMA_N_GPU_LAYERS: ${LLAMA_N_GPU_LAYERS:-0}
      DEVICE: ${DEVICE:-cpu}
      SIMLI_LIVEKIT_URL: ${SIMLI_LIVEKIT_URL}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://news.200.234.41.50.sslip.io}
    ports:
      - "${HOST_WEB_PORT:-${WEB_PORT:-8080}}:8080"
      - "${LIVEKIT_BIND_PORT:-7880}:${LIVEKIT_BIND_PORT:-7880}"
      - "${LIVEKIT_RTC_PORT:-7881}:${LIVEKIT_RTC_PORT:-7881}"
      # WebRTC media over UDP. Host port must equal container port (ICE candidates).
      - "${LIVEKIT_UDP_PORT:-7882}:${LIVEKIT_UDP_PORT:-7882}/udp"
    volumes:
      - models:/models
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  models:
